name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate sample vault offline
        run: |
          chmod +x kb.sh
          ./kb.sh run --offline
          ./kb.sh health
      - name: Validate plugin syntax
        run: node --check .obsidian/plugins/knowledgeflow-review/main.js
