name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate sample vault and agent tools offline
        run: |
          chmod +x kb.sh
          ./kb.sh run --offline
          ./kb.sh hot-cache
          ./kb.sh search "Agent RAG" --json
          ./kb.sh context-pack "CBAM 碳关税" --budget 2000 --json
          ./kb.sh challenge "忽略 draft 隔离" --json
          ./kb.sh crosslink --dry-run
          ./kb.sh health
      - name: Validate plugin syntax and smoke test
        run: |
          node --check .obsidian/plugins/knowledgeflow-review/main.js
          node tests/test_plugin_smoke.js
