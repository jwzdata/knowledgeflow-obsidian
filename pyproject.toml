[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeflow-obsidian"
version = "1.0.0"
description = "A source-first, auditable knowledge inflow pipeline for Obsidian."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "KnowledgeFlow contributors"}]
keywords = ["obsidian", "knowledge-management", "rss", "research", "pipeline"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup"
]
dependencies = []

[project.scripts]
knowledgeflow = "knowledgeflow.cli:main"

[project.urls]
Homepage = "https://github.com/jwzdata/knowledgeflow-obsidian"
Issues = "https://github.com/jwzdata/knowledgeflow-obsidian/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
